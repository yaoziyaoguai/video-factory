name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    name: Test and build Frame
    concurrency:
      group: video-factory-verify-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install media test dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -e . jsonschema==4.25.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run contracts:check && python contracts/agent/v1/verify-openapi.py
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: npm test
      - run: bash -n scripts/deploy-frame.sh
      - name: Build and boot the production image without network or credentials
        run: |
          image=video-factory:release-$GITHUB_SHA
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -f docker/Dockerfile -t "$image" .
          docker run --rm --read-only --tmpfs /tmp:rw,mode=1777 --network none \
            -v "$PWD/scripts/smoke-studio-container.mjs:/tmp/smoke-studio-container.mjs:ro" \
            -e RELEASE_SHA="$GITHUB_SHA" --entrypoint node "$image" /tmp/smoke-studio-container.mjs
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then docker save "$image" | gzip -1 > frame-image.tar.gz; fi
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frame-image
          path: frame-image.tar.gz
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy to Alibaba ECS
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: video-factory-production
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Select current main
        id: latest
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then echo current=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.current == 'true'
        with: {name: frame-image}
      - name: Package the tested release
        if: steps.latest.outputs.current == 'true'
        run: |
          git bundle create "video-factory-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle" HEAD
          mv frame-image.tar.gz "frame-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        if: steps.latest.outputs.current == 'true'
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "video-factory-release-*.bundle,frame-*.tar.gz"
          target: /tmp
          command_timeout: 35m
      - uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        if: steps.latest.outputs.current == 'true'
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          PUBLIC_HEALTH_URL: ${{ secrets.PUBLIC_HEALTH_URL }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          envs: PROJECT_PATH,PUBLIC_HEALTH_URL,RELEASE_SHA,DEPLOY_RUN
          script: |
            set -euo pipefail
            umask 077
            bundle_path="/tmp/video-factory-release-${DEPLOY_RUN}.bundle"
            image="/tmp/frame-${DEPLOY_RUN}.tar.gz"
            trap 'rm -f "$bundle_path" "$image"' EXIT
            exec 9>/var/lock/video-factory-deploy.lock
            flock -w 2400 9
            cd "$PROJECT_PATH"
            git bundle verify "$bundle_path"
            git -C "$PROJECT_PATH" fetch "$bundle_path" HEAD
            test "$(git -C "$PROJECT_PATH" rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
            if [[ -s .last-successful-release ]]; then git merge-base --is-ancestor "$(cat .last-successful-release)" "$RELEASE_SHA"; fi
            release_path="${PROJECT_PATH}.release"
            if [[ -e "$release_path/.git" ]]; then
              if [[ -n "$(git -C "$release_path" status --porcelain=v1 --untracked-files=all)" ]]; then echo "Release worktree is not clean; refusing to reuse it" >&2; exit 1; fi
              git -C "$release_path" checkout --detach "$RELEASE_SHA"
            else
              git worktree add --detach "$release_path" "$RELEASE_SHA"
            fi
            docker load -i "$image"
            bash "$release_path/scripts/deploy-frame.sh"
