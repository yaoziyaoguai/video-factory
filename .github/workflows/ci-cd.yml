name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    name: Test and build Frame
    concurrency:
      group: video-factory-verify-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install media test dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -e . jsonschema==4.25.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run contracts:check && python contracts/agent/v1/verify-openapi.py
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: npm test
      - run: bash -n scripts/deploy-frame.sh && bash -n scripts/smoke-frame-release.sh && node --check scripts/smoke-creative-container.mjs
      - name: Build the same-SHA app and creative images
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -f docker/Dockerfile -t "video-factory:release-$GITHUB_SHA" .
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -f docker/creative.Dockerfile -t "frame-creative:release-$GITHUB_SHA" .
          python - <<'PY'
          import json,os,subprocess
          sha=os.environ['GITHUB_SHA']
          manifest={'sha':sha,'platform':'linux/amd64'}
          for key,prefix in [('app','video-factory'),('creative','frame-creative')]:
              tag=f'{prefix}:release-{sha}'
              image=json.loads(subprocess.check_output(['docker','image','inspect',tag]))[0]
              assert image['Os']+'/'+image['Architecture']==manifest['platform']
              manifest[key]={'tag':tag,'id':image['Id']}
          with open('frame-release.json','w') as f: json.dump(manifest,f,indent=2)
          print(json.dumps(manifest))
          PY
      - name: Boot the production app without network or credentials
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,mode=1777 --network none \
            -v "$PWD/scripts/smoke-studio-container.mjs:/tmp/smoke-studio-container.mjs:ro" \
            -e RELEASE_SHA="$GITHUB_SHA" --entrypoint node "video-factory:release-$GITHUB_SHA" /tmp/smoke-studio-container.mjs
      - name: Rehearse real Linux app, UDS, migration and release recovery
        run: |
          bash scripts/smoke-frame-release.sh
      - name: Package only the verified release tags
        run: |
          docker save "video-factory:release-$GITHUB_SHA" "frame-creative:release-$GITHUB_SHA" | gzip -1 > frame-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: frame-release
          path: |
            frame-images.tar.gz
            frame-release.json
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-release-rehearsal
          path: ${{ runner.temp }}/frame-release-evidence/
          retention-days: 7

  deploy:
    name: Deploy to Alibaba ECS
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: video-factory-production
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Select current main
        id: latest
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then echo current=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.current == 'true'
        with: {name: frame-release}
      - name: Package the tested release
        if: steps.latest.outputs.current == 'true'
        run: |
          git bundle create "video-factory-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle" HEAD
          mv frame-images.tar.gz "frame-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          mv frame-release.json "frame-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        if: steps.latest.outputs.current == 'true'
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "video-factory-release-*.bundle,frame-*.tar.gz,frame-release-*.json"
          target: /tmp
          command_timeout: 35m
      - uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        if: steps.latest.outputs.current == 'true'
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          PUBLIC_HEALTH_URL: ${{ secrets.PUBLIC_HEALTH_URL }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          envs: PROJECT_PATH,PUBLIC_HEALTH_URL,RELEASE_SHA,DEPLOY_RUN
          script: |
            set -euo pipefail
            umask 077
            bundle_path="/tmp/video-factory-release-${DEPLOY_RUN}.bundle"
            image="/tmp/frame-${DEPLOY_RUN}.tar.gz"
            export RELEASE_MANIFEST="/tmp/frame-release-${DEPLOY_RUN}.json"
            trap 'rm -f "$bundle_path" "$image" "$RELEASE_MANIFEST"' EXIT
            exec 9>/var/lock/video-factory-deploy.lock
            flock -w 2400 9
            cd "$PROJECT_PATH"
            git bundle verify "$bundle_path"
            git -C "$PROJECT_PATH" fetch "$bundle_path" HEAD
            test "$(git -C "$PROJECT_PATH" rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
            if [[ -s .last-successful-release ]]; then git merge-base --is-ancestor "$(cat .last-successful-release)" "$RELEASE_SHA"; fi
            release_path="${PROJECT_PATH}.release"
            if [[ -e "$release_path/.git" ]]; then
              if [[ -n "$(git -C "$release_path" status --porcelain=v1 --untracked-files=all)" ]]; then echo "Release worktree is not clean; refusing to reuse it" >&2; exit 1; fi
              git -C "$release_path" checkout --detach "$RELEASE_SHA"
            else
              git worktree add --detach "$release_path" "$RELEASE_SHA"
            fi
            docker load -i "$image"
            bash "$release_path/scripts/deploy-frame.sh"
