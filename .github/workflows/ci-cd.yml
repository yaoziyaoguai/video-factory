name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: video-factory-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e .
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: npm test
      - run: bash -n scripts/deploy-production.sh scripts/backup-production.sh scripts/setup-codex-broker-host.sh scripts/setup-zai-codex-broker-host.sh
      - run: docker compose --env-file .env.docker.prod.example -f docker/docker-compose.prod.yml config --quiet
      - run: >-
          docker build
          --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:22-alpine
          --file docker/Dockerfile
          --tag video-factory:ci .
      - name: Render a Linux container smoke video
        run: >-
          docker run --rm video-factory:ci
          node packages/production-pipeline/dist/cli.js run
          examples/briefs/linux-container-smoke.json
          --workspace /tmp/video-factory-smoke

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to Alibaba ECS
    runs-on: ubuntu-latest
    needs: [verify, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy with rollback
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          PUBLIC_HEALTH_URL: ${{ secrets.PUBLIC_HEALTH_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          envs: PROJECT_PATH,PUBLIC_HEALTH_URL
          script: |
            set -euo pipefail
            release_path="${PROJECT_PATH}.release"
            cd "$PROJECT_PATH"
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            if [[ -e "$release_path/.git" ]]; then
              git -C "$release_path" checkout --detach origin/main
            elif [[ -e "$release_path" ]]; then
              echo "Release path exists but is not a Git worktree: $release_path" >&2
              exit 1
            else
              git worktree add --detach "$release_path" origin/main
            fi
            VIDEO_FACTORY_ENV_FILE="$PROJECT_PATH/.env.docker.prod" \
              PUBLIC_HEALTH_URL="$PUBLIC_HEALTH_URL" \
              bash "$release_path/scripts/deploy-production.sh"
