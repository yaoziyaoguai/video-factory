services:
  app:
    image: video-factory:release-${RELEASE_SHA:?set RELEASE_SHA}
    container_name: video_factory_prod
    restart: unless-stopped
    environment:
      FRAME_BILLING_STATEMENT_SOURCE: ${FRAME_BILLING_STATEMENT_SOURCE:-/data/factory/agent/billing-statements.ndjson}
      FRAME_BUDGET_TZ: ${FRAME_BUDGET_TZ:-Asia/Shanghai}
      FRAME_ASR_LANGUAGE: ${FRAME_ASR_LANGUAGE:-}
      FRAME_MEDIA_RETENTION_DAYS: ${FRAME_MEDIA_RETENTION_DAYS:-30}
      FRAME_CREDENTIAL_SECRET: ${FRAME_CREDENTIAL_SECRET:?set a persistent 32-byte credential encryption secret}
      RELEASE_SHA: ${RELEASE_SHA}
      AGENT_UI_ORIGIN: ${AGENT_UI_ORIGIN:?set public HTTPS origin}
      AGENT_EDGE_TTS_PYTHON: ${FRAME_EDGE_TTS_PYTHON:-python3}
      VIDEO_FACTORY_AUTH_USERNAME: ${VIDEO_FACTORY_AUTH_USERNAME:?set username}
      VIDEO_FACTORY_AUTH_PASSWORD_HASH: ${VIDEO_FACTORY_AUTH_PASSWORD_HASH:?set password hash}
      VIDEO_FACTORY_AUTH_SESSION_SECRET: ${VIDEO_FACTORY_AUTH_SESSION_SECRET:?set session secret}
      VIDEO_FACTORY_AUTH_SESSION_TTL_SECONDS: ${VIDEO_FACTORY_AUTH_SESSION_TTL_SECONDS:-43200}
      HTTP_PROXY: ${FRAME_HTTP_PROXY:-}
      HTTPS_PROXY: ${FRAME_HTTPS_PROXY:-}
      NO_PROXY: ${FRAME_NO_PROXY:-localhost,127.0.0.1,vf-newsnow}
      NODE_USE_ENV_PROXY: "1"
      # Compose --env-file 只解析 YAML 占位符、不注入容器进程环境；同网 NewsNow
      # 白名单必须在此显式承接，否则 network-policy 会把私网 origin 当非法探测拦截。
      NEWSNOW_ALLOWED_ORIGINS: ${NEWSNOW_ALLOWED_ORIGINS:-}
      # Compose 发布端口时容器内对端是网桥网关而非环回；放行默认 Docker 网段，
      # 使宿主 Nginx 追加的 X-Forwarded-For 生效（登录限流按真实客户端 IP 计数）。
      STUDIO_TRUST_PROXY: ${STUDIO_TRUST_PROXY:-172.16.0.0/12}
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - workspace:/data/factory
    networks: [trend-services]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,mode=1777,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  workspace:
    external: true
    name: video-factory_video_factory_workspace
networks:
  trend-services:
    external: true
    name: video-factory-trends
