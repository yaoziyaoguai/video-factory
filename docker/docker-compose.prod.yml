services:
  app:
    image: video-factory:release-${RELEASE_SHA:?set RELEASE_SHA}
    container_name: video_factory_prod
    restart: unless-stopped
    environment:
      RELEASE_SHA: ${RELEASE_SHA}
      AGENT_UI_ORIGIN: ${AGENT_UI_ORIGIN:?set public HTTPS origin}
      VIDEO_FACTORY_AUTH_USERNAME: ${VIDEO_FACTORY_AUTH_USERNAME:?set username}
      VIDEO_FACTORY_AUTH_PASSWORD_HASH: ${VIDEO_FACTORY_AUTH_PASSWORD_HASH:?set password hash}
      VIDEO_FACTORY_AUTH_SESSION_SECRET: ${VIDEO_FACTORY_AUTH_SESSION_SECRET:?set session secret}
      VIDEO_FACTORY_AUTH_SESSION_TTL_SECONDS: ${VIDEO_FACTORY_AUTH_SESSION_TTL_SECONDS:-43200}
      HTTP_PROXY: ${FRAME_HTTP_PROXY:-}
      HTTPS_PROXY: ${FRAME_HTTPS_PROXY:-}
      NO_PROXY: ${FRAME_NO_PROXY:-localhost,127.0.0.1,vf-newsnow,vf-trendradar,vf-dailyhot,vf-rsshub}
      NODE_USE_ENV_PROXY: "1"
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - workspace:/data/factory
    networks: [trend-services]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,mode=1777,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  workspace:
    external: true
    name: video-factory_video_factory_workspace
networks:
  trend-services:
    external: true
    name: video-factory-trends
