# 两个监听入口在各自的 server 中固定加载。健康探针在切换与回滚时都须看到真实上游。
set $frame_release_path "";
if (-f /run/video-factory/frame.maintenance) {
    set $frame_release_path $uri;
}
if ($frame_release_path ~ "^/(?!api/health$)") {
    return 503;
}
error_page 503 @frame_release_maintenance;
location @frame_release_maintenance {
    default_type text/plain;
    charset utf-8;
    include /etc/nginx/snippets/frame-security-headers.conf;
    add_header Retry-After 3 always;
    return 503 "正在发布，请稍后重试。\n";
}
