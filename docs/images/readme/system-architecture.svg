<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 894 484" width="894" height="484" role="img" aria-label="Pi 只管对话、草稿与提案；付费与外部媒体必须经确认门交由 Worker 执行">
  
  <style>
    .canvas { fill: #FAF9F5; stroke: #DEDBD2; stroke-width: 1.25; }
    .topbar { fill: #F2F1EB; }
    .topline { stroke: #E2DFD7; stroke-width: 1; }
    .kicker { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 11px; font-weight: 700; fill: #60645E; letter-spacing: 0.08em; }
    .heading { font-family: "Songti SC", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", serif; font-size: 16.5px; font-weight: 700; fill: #242522; }
    .plane-chat { fill: #F4F3EE; stroke: #D8D5CB; stroke-width: 1.2; }
    .plane-exec { fill: #EEF4F0; stroke: #B8D0C2; stroke-width: 1.25; }
    .plane-amber { fill: #FBF6EC; stroke: #E2CCA5; stroke-width: 1.25; }
    .plane-terra { fill: #FBF3EE; stroke: #DFB8A8; stroke-width: 1.25; }
    .plane-title { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 13.5px; font-weight: 700; fill: #242522; }
    .plane-caption { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 11.5px; font-weight: 500; fill: #5C6059; }
    .node { fill: #FFFFFF; stroke: #D8D5CB; stroke-width: 1.2; }
    .node-green { fill: #FFFFFF; stroke: #90B8A1; stroke-width: 1.35; }
    .node-amber { fill: #FFFFFF; stroke: #D6B882; stroke-width: 1.35; }
    .node-terra { fill: #FFFFFF; stroke: #D49E8B; stroke-width: 1.35; }
    .node-dark { fill: #242522; stroke: #242522; stroke-width: 1.2; }
    .node-soft { fill: #F5F4EE; stroke: #D8D5CB; stroke-width: 1.15; }
    .n-title { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 14px; font-weight: 700; fill: #242522; }
    .n-title-inv { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 14px; font-weight: 700; fill: #FAF9F5; }
    .n-sub { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 12px; font-weight: 400; fill: #5C6059; }
    .n-sub-inv { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 11.5px; font-weight: 400; fill: #D8D6CE; }
    .tag-green { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 11.5px; font-weight: 700; fill: #2F5D44; }
    .tag-amber { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 11.5px; font-weight: 700; fill: #7D5318; }
    .tag-terra { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 11.5px; font-weight: 700; fill: #98442D; }
    .tag-ink { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 11.5px; font-weight: 600; fill: #3E413C; }
    .pill-green { fill: #EEF4F0; stroke: #A6C6B3; stroke-width: 1; }
    .pill-amber { fill: #FBF6EC; stroke: #DFC492; stroke-width: 1; }
    .pill-terra { fill: #FBF3EE; stroke: #DDB09E; stroke-width: 1; }
    .pill-ink { fill: #ECEAE2; stroke: #D2CFC5; stroke-width: 1; }
    .pill-paper { fill: #FAF9F5; stroke: #DCD9D0; stroke-width: 1; }
    .line-ink { fill: none; stroke: #5C6059; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .line-green { fill: none; stroke: #2F5D44; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .line-amber { fill: none; stroke: #7D5318; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .line-terra { fill: none; stroke: #98442D; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 5 4; }
    .edge-txt { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; font-size: 11px; font-weight: 600; fill: #444742; }
  </style>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#5C6059"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#2F5D44"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7D5318"/>
    </marker>
    <marker id="m-terra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#98442D"/>
    </marker>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#242522" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="892" height="482" rx="14" class="canvas"/>
  <path d="M 1 15 Q 1 1 15 1 L 879 1 Q 893 1 893 15 L 893 58 L 1 58 Z" class="topbar"/>
  <line x1="1" y1="58" x2="893" y2="58" class="topline"/>
  <circle cx="26" cy="29" r="5" fill="#2F5D44"/>
  <text x="40" y="24" class="kicker">ARCHITECTURE · 云端工作台与两阶段执行边界</text>
  <text x="40" y="45" class="heading">Pi 只管对话、草稿与提案；付费与外部媒体必须经确认门交由 Worker 执行</text>
  <rect x="686" y="17" width="184" height="25" rx="12.5" class="pill-ink"/>
  <text x="778" y="33.5" text-anchor="middle" class="tag-ink">浏览器里的云端工作台</text>
  
  <!-- TOP: Browser Web Studio Bar -->
  <g filter="url(#cardShadow)" data-box="26,72,842,58">
    <rect x="26" y="72" width="842" height="58" rx="12" class="node-dark"/>
    <circle cx="54" cy="101" r="13" fill="#2F5D44"/>
    <path d="M 48 101 h 12 M 54 95 v 12" stroke="#FAF9F5" stroke-width="1.8" stroke-linecap="round"/>
    <text x="78" y="98" class="n-title-inv">创作者浏览器工作台（Web Studio）</text>
    <text x="78" y="117" class="n-sub-inv">多作品审稿 · 制作提案选模与授权 · 断线快照续订流式进度</text>
    <rect x="652" y="86" width="198" height="30" rx="15" fill="#353833"/>
    <text x="751" y="105.5" text-anchor="middle" class="n-sub-inv">HTTPS 命令回执 + SSE 事件流</text>
  </g>

  <!-- LEFT PLANE: Pi Conversation & Proposal Plane -->
  <rect x="26" y="158" width="352" height="232" rx="14" class="plane-chat"/>
  <text x="42" y="182" class="plane-title">对话与草稿侧</text>
  <rect x="134" y="168" width="114" height="20" rx="10" class="pill-terra"/>
  <text x="191" y="182" text-anchor="middle" class="tag-terra">不直发付费媒体</text>
  <text x="42" y="201" class="plane-caption">理解意图 · 改草稿 · 提方案</text>

  <!-- Browser -> Pi arrow at x=322 (74px right of header text, zero overlap!) -->
  <line x1="322" y1="130" x2="322" y2="212" class="line-ink" marker-end="url(#m-ink)"/>
  <rect x="284" y="138" width="76" height="20" rx="10" class="pill-paper"/>
  <text x="322" y="152" text-anchor="middle" class="edge-txt">对话 / 审稿</text>

  <g filter="url(#cardShadow)" data-box="42,214,142,48">
    <rect x="42" y="214" width="142" height="48" rx="9" class="node"/>
    <text x="56" y="236" class="n-title">文本大模型</text>
    <text x="56" y="253" class="n-sub">对话与分镜推理</text>
  </g>

  <g filter="url(#cardShadow)" data-box="42,270,142,48">
    <rect x="42" y="270" width="142" height="48" rx="9" class="node"/>
    <text x="56" y="292" class="n-title">免费素材与热榜</text>
    <text x="56" y="309" class="n-sub">实拍检索 · 选题</text>
  </g>

  <g filter="url(#cardShadow)" data-box="204,214,158,104">
    <rect x="204" y="214" width="158" height="104" rx="10" class="node"/>
    <rect x="204" y="214" width="158" height="5" rx="2.5" fill="#242522"/>
    <text x="218" y="242" class="n-title">Pi 对话与工具</text>
    <text x="218" y="264" class="n-sub">会话上下文 · Skill</text>
    <text x="218" y="284" class="n-sub">读写草稿 · 发起提案</text>
    <text x="218" y="304" class="tag-terra">✕ 无权直发付费视频</text>
  </g>

  <g filter="url(#cardShadow)" data-box="42,328,320,48">
    <rect x="42" y="328" width="320" height="48" rx="9" class="node-terra"/>
    <rect x="42" y="328" width="5" height="48" rx="2.5" fill="#98442D"/>
    <text x="58" y="349" class="n-title">禁网代码创作沙盒（宿主窄通道调用）</text>
    <text x="58" y="367" class="n-sub">隔离运行排版与动画代码 · 无密钥 · 无外网</text>
  </g>

  <!-- Connectors inside Left Plane -->
  <line x1="204" y1="238" x2="186" y2="238" class="line-ink dash" marker-end="url(#m-ink)"/>
  <line x1="204" y1="294" x2="186" y2="294" class="line-ink dash" marker-end="url(#m-ink)"/>
  <line x1="283" y1="318" x2="283" y2="326" class="line-terra" marker-end="url(#m-terra)"/>

  <!-- CENTER GATE: Explicit Creator Authorization & Freeze -->
  <g filter="url(#cardShadow)" data-box="394,210,104,126">
    <rect x="394" y="210" width="104" height="126" rx="14" class="node-amber"/>
    <circle cx="446" cy="242" r="15" fill="#FBF6EC" stroke="#7D5318" stroke-width="1.5"/>
    <rect x="440" y="241" width="12" height="9" rx="2" fill="#7D5318"/>
    <path d="M 442.5 241 v -3.5 a 3.5 3.5 0 0 1 7 0 v 3.5" fill="none" stroke="#7D5318" stroke-width="1.6"/>
    <text x="446" y="276" text-anchor="middle" class="n-title">确认与冻结</text>
    <text x="446" y="297" text-anchor="middle" class="tag-amber">人工授权预算</text>
    <text x="446" y="316" text-anchor="middle" class="n-sub">锁输入与模型</text>
  </g>

  <!-- Browser confirms Gate; Pi submits proposal straight right into Gate -->
  <line x1="446" y1="130" x2="446" y2="208" class="line-amber" marker-end="url(#m-amber)"/>
  <rect x="401" y="158" width="90" height="21" rx="10.5" class="pill-amber"/>
  <text x="446" y="172.5" text-anchor="middle" class="tag-amber">点击确认制作</text>

  <line x1="362" y1="272" x2="392" y2="272" class="line-amber" marker-end="url(#m-amber)"/>

  <!-- RIGHT PLANE: Authorized Production Execution Plane -->
  <rect x="514" y="158" width="354" height="232" rx="14" class="plane-exec"/>
  <text x="532" y="182" class="plane-title">授权后制作执行侧（后台异步完成）</text>
  <text x="532" y="201" class="plane-caption">按冻结绑定执行，关闭网页或改默认不中断</text>

  <g filter="url(#cardShadow)" data-box="528,214,128,96">
    <rect x="528" y="214" width="128" height="96" rx="10" class="node-green"/>
    <rect x="528" y="214" width="128" height="5" rx="2.5" fill="#2F5D44"/>
    <text x="542" y="242" class="n-title">Production</text>
    <text x="542" y="261" class="n-title">Worker</text>
    <text x="542" y="284" class="n-sub">拆解镜头操作</text>
    <text x="542" y="301" class="tag-green">轮询与记账</text>
  </g>

  <g filter="url(#cardShadow)" data-box="674,214,178,96">
    <rect x="674" y="214" width="178" height="96" rx="10" class="node-amber"/>
    <text x="688" y="238" class="n-title">媒体执行网关</text>
    <line x1="688" y1="248" x2="838" y2="248" stroke="#ECEAE2" stroke-width="1"/>
    <text x="688" y="268" class="n-sub">厂商 API（方舟/百炼等）</text>
    <text x="688" y="288" class="tag-amber">Google Colab LTX-2.5</text>
    <text x="688" y="303" class="n-sub">云端 GPU 按 CU 记账</text>
  </g>

  <g filter="url(#cardShadow)" data-box="528,324,324,52">
    <rect x="528" y="324" width="324" height="52" rx="9" class="node"/>
    <rect x="528" y="324" width="5" height="52" rx="2.5" fill="#2F5D44"/>
    <text x="544" y="347" class="n-title">服务端媒体合成（云端直接处理）</text>
    <text x="544" y="366" class="n-sub">FFmpeg 多轨混剪 · 离线字幕 · 免费配音</text>
  </g>

  <!-- Gate -> Worker -> Gateway & Server Media -->
  <line x1="498" y1="272" x2="526" y2="272" class="line-green" marker-end="url(#m-green)"/>
  <line x1="656" y1="262" x2="672" y2="262" class="line-amber" marker-end="url(#m-amber)"/>
  <line x1="592" y1="310" x2="592" y2="322" class="line-green" marker-end="url(#m-green)"/>

  <!-- BOTTOM SHARED PERSISTENCE BAR -->
  <g filter="url(#cardShadow)" data-box="26,408,842,54">
    <rect x="26" y="408" width="842" height="54" rx="11" class="node-soft"/>
    <text x="46" y="432" class="n-title">作品事实与持久媒体库（SQLite 状态事件库 + 内容寻址媒体卷）</text>
    <text x="46" y="451" class="n-sub">统一保存会话、草稿修订、认可记录、冻结提案、运行账单与成片文件，向浏览器实时推送新版本</text>
  </g>

  <line x1="202" y1="390" x2="202" y2="406" class="line-ink" marker-end="url(#m-ink)"/>
  <line x1="690" y1="390" x2="690" y2="406" class="line-green" marker-end="url(#m-green)"/>
  
</svg>
