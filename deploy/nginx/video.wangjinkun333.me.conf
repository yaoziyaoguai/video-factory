server {
    listen 80;
    listen [::]:80;
    server_name video.wangjinkun333.me;
    include /etc/nginx/snippets/frame-security-headers.conf;
    include /etc/nginx/snippets/frame-release-maintenance.conf;

    location = /api/health {
        proxy_pass http://127.0.0.1:4317;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name video.wangjinkun333.me;
    ssl_certificate /etc/letsencrypt/live/video.wangjinkun333.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.wangjinkun333.me/privkey.pem;
    include /etc/nginx/snippets/frame-security-headers.conf;
    include /etc/nginx/snippets/frame-release-maintenance.conf;

    client_max_body_size 256m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header X-Content-Type-Options;
    proxy_buffering off;
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    location ~ ^/api/agent/v1/conversations/[^/]+/uploads$ {
        client_max_body_size 513m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4317;
    }
    location / {
        proxy_pass http://127.0.0.1:4317;
    }
}
